[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdm-engine"
version = "0.2.0"
description = "Databricks / Spark-native Customer MDM Match & Merge engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MDM Engineering" }]
# PySpark and Delta come from the Databricks Runtime; the match engine adds nothing.
dependencies = []

[project.optional-dependencies]
# Real runtime deps of src/dq (Google Places enrichment); installed on the cluster only
# if you use that module: pip install "mdm-engine[dq]"
dq = ["pandas>=2.0,<3.0", "requests>=2.31"]
# Local editing / type-checking. Mirrors requirements.txt, which is what PyCharm reads —
# keep the two in step. Never installed on a Databricks cluster.
dev = ["pyspark>=3.5,<5", "databricks-sdk>=0.20", "pandas>=2.0,<3.0", "requests>=2.31"]
# The test suite runs on a Databricks cluster (see docs/TESTING.md), where Spark and Delta
# come from the runtime. pytest is the only thing to install there.
test = ["pytest>=7.0"]

[project.scripts]
mdm-match = "matching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the storage config and the country configs inside the wheel so an install is
# runnable as-is. MDM_CONF_DIR (whole folder) or MDM_STORAGE_CONFIG (that one file)
# overrides them at runtime without a rebuild.
matching = ["conf/storage.config", "conf/*.json", "conf/countries/*.json"]
